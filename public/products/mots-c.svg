<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFBF9"/>
      <stop offset="1" stop-color="#EFF1EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F2F4F0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E6EAE3" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4EDDB"/>
      <stop offset="1" stop-color="#68A038" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#333331"/>
      <stop offset="0.5" stop-color="#4A4A46"/>
      <stop offset="1" stop-color="#242422"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="560" r="430" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="600" cy="560" r="430" fill="none" stroke="#E3E6E1" stroke-width="1.5"/>
  <!-- orbital motif -->
  <g opacity="0.35" stroke="#68A038" stroke-width="1.5" fill="none">
    <ellipse cx="600" cy="560" rx="500" ry="200"/>
    <ellipse cx="600" cy="560" rx="500" ry="200" transform="rotate(60 600 560)"/>
  </g>
  <!-- vial shadow -->
  <ellipse cx="600" cy="905" rx="210" ry="34" fill="#282828" opacity="0.08"/>
  <!-- vial body -->
  <rect x="470" y="330" width="260" height="560" rx="34" fill="url(#glass)" stroke="#CBD2C7" stroke-width="2"/>
  <!-- liquid -->
  <rect x="486" y="640" width="228" height="234" rx="22" fill="url(#liquid)"/>
  <!-- glass highlight -->
  <rect x="498" y="360" width="26" height="500" rx="13" fill="#FFFFFF" opacity="0.7"/>
  <!-- neck + crimp cap -->
  <rect x="530" y="270" width="140" height="70" fill="url(#glass)" stroke="#CBD2C7" stroke-width="2"/>
  <rect x="512" y="206" width="176" height="74" rx="12" fill="url(#cap)"/>
  <rect x="512" y="240" width="176" height="6" fill="#1A1A18" opacity="0.6"/>
  <circle cx="600" cy="243" r="26" fill="#68A038"/>
  <circle cx="600" cy="243" r="26" fill="none" stroke="#4E7D29" stroke-width="2" opacity="0.35"/>
  <!-- label -->
  <rect x="470" y="470" width="260" height="240" fill="#FFFFFF" opacity="0.94"/>
  <rect x="470" y="470" width="260" height="240" fill="none" stroke="#E3E6E1" stroke-width="1.5"/>
  <rect x="470" y="470" width="260" height="10" fill="#68A038"/>
  <text x="600" y="560" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="0.08em" fill="#282828">MOTS-c</text><text x="600" y="606" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" letter-spacing="0.22em" fill="#282828">RESEARCH PEPTIDE</text>
  <text x="600" y="688" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="0.28em" fill="#5C615A">RESEARCH USE ONLY</text>
</svg>